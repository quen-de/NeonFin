[project]
name = "neonfin"
version = "0.1.0"
description = "A fast glass-and-neon web skin for Jellyfin 12"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["playwright>=1.48", "pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "fonttools[woff]>=4.50"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs a Jellyfin server (env vars and harness/config.local.json)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
